{% extends 'attendance/base.html' %}

{% block content %}
<div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8 text-center">
    <h2 class="text-3xl font-bold text-gray-800 mb-6">Librarian Login</h2>
    
    {% if messages %}
        {% for message in messages %}
            <div class="mb-4 text-red-500 text-sm font-medium">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="POST" action="{% url 'dashboard_login' %}" class="space-y-6">
        {% csrf_token %}
        <div>
            <label for="password" class="block text-left text-sm font-medium text-gray-700 mb-1">Enter Password</label>
            <input type="password" id="password" name="password" required autofocus
                   class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                   placeholder="Password">
        </div>
        <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 transition duration-200 shadow-md">
            Login
        </button>
    </form>
    
    <div class="mt-6">
        <a href="{% url 'home' %}" class="text-sm text-blue-600 hover:underline">Back to Check-in</a>
    </div>
</div>
{% endblock %}
